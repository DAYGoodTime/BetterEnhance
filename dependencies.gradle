/*
 * Add your dependencies here. Supported configurations:
 *  - api("group:name:version:classifier"): if you use the types from this dependency in the public API of this mod
 *       Available at runtime and compiletime for mods depending on this mod
 *  - implementation("g:n:v:c"): if you need this for internal implementation details of the mod, but none of it is visible via the public API
 *       Available at runtime but not compiletime for mods depending on this mod
 *  - compileOnly("g:n:v:c"): if the mod you're building doesn't need this dependency during runtime at all, e.g. for optional mods
 *       Not available at all for mods depending on this mod, only visible at compiletime for this mod
 *  - compileOnlyApi("g:n:v:c"): like compileOnly, but also visible at compiletime for mods depending on this mod
 *       Available at compiletime but not runtime for mods depending on this mod
 *  - runtimeOnlyNonPublishable("g:n:v:c"): if you want to include a mod in this mod's runClient/runServer runs, but not publish it as a dependency
 *       Not available at all for mods depending on this mod, only visible at runtime for this mod
 *  - devOnlyNonPublishable("g:n:v:c"): a combination of runtimeOnlyNonPublishable and compileOnly for dependencies present at both compiletime and runtime,
 *       but not published as Maven dependencies - useful for RFG-deobfuscated dependencies or local testing
 *  - runtimeOnly("g:n:v:c"): if you don't need this at compile time, but want it to be present at runtime
 *       Available at runtime for mods depending on this mod
 *  - annotationProcessor("g:n:v:c"): mostly for java compiler plugins, if you know you need this, use it, otherwise don't worry
 *  - testCONFIG("g:n:v:c") - replace CONFIG by one of the above (except api), same as above but for the test sources instead of main
 *
 *  - shadowImplementation("g:n:v:c"): effectively the same as API, but the dependency is included in your jar under a renamed package name
 *       Requires you to enable usesShadowedDependencies in gradle.properties
 *
 *  - compile("g:n:v:c"): deprecated, replace with "api" (works like the old "compile") or "implementation" (can be more efficient)
 *
 * You can exclude transitive dependencies (dependencies of the chosen dependency) by appending { transitive = false } if needed,
 * but use this sparingly as it can break using your mod as another mod's dependency if you're not careful.
 *
 * To depend on obfuscated jars you can use `devOnlyNonPublishable(rfg.deobf("dep:spec:1.2.3"))` to fetch an obfuscated jar from maven,
 * or `devOnlyNonPublishable(rfg.deobf(project.files("libs/my-mod-jar.jar")))` to use a file.
 *
 * Gradle names for some of the configuration can be misleading, compileOnlyApi and runtimeOnly both get published as dependencies in Maven, but compileOnly does not.
 * The buildscript adds runtimeOnlyNonPublishable to also have a runtime dependency that's not published.
 *
 * For more details, see https://docs.gradle.org/8.0.1/userguide/java_library_plugin.html#sec:java_library_configurations_graph
 */
dependencies {
    elytraModpackVersion {
        // 在这配置的gtnh版本 用于自动拉取依赖版本
        gtnhVersion = "2.9.0"
        // 是否不缓存拉取的依赖清单文件
        manifestNoCache = false
        // 是否自动为输出的jar添加 `gtnhVersion` 后缀
        attachManifestVersionToJar = true
    }

    // GTNH：本项目直接引用的类型，编译和运行都需要。
    // UniMixins 由 GTNH convention 的 usesMixins 提供。
    implementation(gtnhDev("AE2FluidCraft-Rework"))
    implementation(gtnhDev("Applied-Energistics-2-Unofficial"))
    implementation(gtnhDev("GT5-Unofficial"))
    implementation(gtnhDev("GTNHLib"))
    implementation(gtnhDev("ModularUI"))
    implementation(gtnhDev("ModularUI2"))
    implementation(gtnhDev("StructureLib"))
    implementation(gtnhDev("waila"))

    // 可选 TST 集成：需要编译和开发运行，但不发布为强制依赖。
    devOnlyNonPublishable("com.github.Nxer:Twist-Space-Technology-Mod:0.8.2:dev")

    // GTNH：开发整合包内容、配方材料和传递兼容，不发布为本项目依赖。
    runtimeOnlyNonPublishable(gtnhDev("AppleCore"))
    runtimeOnlyNonPublishable(gtnhDev("Avaritia"))
    runtimeOnlyNonPublishable(gtnhDev("Avaritiaddons"))
    runtimeOnlyNonPublishable(gtnhDev("bdlib"))
    // CropsNH 的 post-init 兼容处理器即使未安装魔杖模组仍会解析其 API。
    runtimeOnlyNonPublishable(gtnhDev("BetterBuildersWands"))
    runtimeOnlyNonPublishable(gtnhDev("Binnie"))
    runtimeOnlyNonPublishable(gtnhDev("BlockRenderer6343")) { transitive = false }
    runtimeOnlyNonPublishable(gtnhDev("BloodMagic"))
    runtimeOnlyNonPublishable(gtnhDev("Botania"))
    // BuildCraft 和 Irontanks 供单元毁灭者制造配方按注册名查找储罐。
    runtimeOnlyNonPublishable(gtnhDev("BuildCraft"))
    runtimeOnlyNonPublishable(gtnhDev("Chisel"))
    runtimeOnlyNonPublishable(gtnhDev("Draconic-Evolution"))
    runtimeOnlyNonPublishable(gtnhDev("EnderIO"))
    runtimeOnlyNonPublishable(gtnhDev("Eternal-Singularity"))
    runtimeOnlyNonPublishable(gtnhDev("ForestryMC"))
    runtimeOnlyNonPublishable(gtnhDev("Galaxy-Space-GTNH"))
    // 基因处理配方的开发测试内容。
    runtimeOnlyNonPublishable(gtnhDev("gendustry")) { transitive = false }
    runtimeOnlyNonPublishable(gtnhDev("Infernal-Mobs"))
    runtimeOnlyNonPublishable(gtnhDev("Irontanks"))
    runtimeOnlyNonPublishable(gtnhDev("MagicBees"))
    runtimeOnlyNonPublishable(gtnhDev("MatterManipulator"))
    runtimeOnlyNonPublishable(gtnhDev("neiaddons"))
    runtimeOnlyNonPublishable(gtnhDev("NewHorizonsCoreMod"))
    runtimeOnlyNonPublishable(gtnhDev("NotEnoughEnergistics"))
    runtimeOnlyNonPublishable(gtnhDev("NotEnoughItems"))
    runtimeOnlyNonPublishable(gtnhDev("OpenComputers"))
    runtimeOnlyNonPublishable(gtnhDev("SGCraft"))
    runtimeOnlyNonPublishable(gtnhDev("SpiceOfLife"))
    runtimeOnlyNonPublishable(gtnhDev("supersolarpanels"))
    runtimeOnlyNonPublishable(gtnhDev("ThaumicEnergistics"))
    runtimeOnlyNonPublishable(gtnhDev("ThaumicTinkerer"))
    runtimeOnlyNonPublishable(gtnhDev("twilightforest"))
    runtimeOnlyNonPublishable(gtnhDev("Universal-Singularities"))
    runtimeOnlyNonPublishable(gtnhDev("WitcheryExtras"))

    // 开发运行：使用固定 Maven 坐标或需要反混淆的外部模组。
    runtimeOnlyNonPublishable(rfg.deobf("curse.maven:advsolar-362768:2885953"))
    runtimeOnlyNonPublishable(rfg.deobf("curse.maven:BiomesOPlenty-220318:2499612"))
    runtimeOnlyNonPublishable("ganymedes01.etfuturum:Et-Futurum-Requiem:2.6.60-GTNH:dev")
    runtimeOnlyNonPublishable(rfg.deobf("curse.maven:extra-utilities-225561:2264384"))
    runtimeOnlyNonPublishable("net.industrial-craft:industrialcraft-2:2.2.828-experimental:dev")
    runtimeOnlyNonPublishable("thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev")
    // TCNEIAdditions/ThaumicTinkerer 传递引入 SRG 包；开发运行需要转换为 MCP。
    runtimeOnlyNonPublishable(rfg.deobf("curse.maven:thaumcraft-nei-plugin-225095:2241913"))
    runtimeOnlyNonPublishable(deobfCurse("witchery-69673:2234410"))

    // jvmDowngrader
    compileOnly("javax.xml.bind:jaxb-api:2.3.1")
    compileOnly("org.jetbrains:annotations:26.0.1")
    compileOnly("org.projectlombok:lombok:1.18.46") { transitive = false }
    annotationProcessor("org.projectlombok:lombok:1.18.46")

    configurations.configureEach {
        exclude group: 'com.github.GTNewHorizons', module: 'Baubles'
    }

    configurations.all {
        resolutionStrategy {
            force "com.github.GTNewHorizons:GTNHLib:0.11.52"
        }
    }
}

// TST's module metadata omits these classifiers; mixing plain and dev jars duplicates Forge mod IDs.
configurations.configureEach {
    resolutionStrategy.dependencySubstitution.all { substitution ->
        def requested = substitution.requested
        if (requested instanceof org.gradle.api.artifacts.component.ModuleComponentSelector
            && ((requested.group == 'io.github.legacymoddingmc' && requested.module == 'unimixins')
                || (requested.group == 'thaumcraft' && requested.module == 'Thaumcraft'))) {
            substitution.useTarget(requested, 'Use one dev artifact per mod in the development classpath')
            substitution.artifactSelection {
                selectArtifact('jar', 'jar', 'dev')
            }
        }
    }
}


@SuppressWarnings('GrMethodMayBeStatic')
String gtnhDev(String name, String classifier = "dev") {
    return elytraModpackVersion.gtnh(name, classifier)
}
