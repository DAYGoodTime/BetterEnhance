// Add any additional repositories for your dependencies here.

repositories {
    exclusiveContent {
        forRepository {
            project.repositories.maven {
                name = 'glease'
                url = 'https://maven.glease.net/repos/releases/'
            }
        }
        filter {
            includeGroup('net.glease')
        }
    }
    mavenLocal()
    maven {
        url = uri("https://jitpack.io")
    }
}
